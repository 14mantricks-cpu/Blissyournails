<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlissYourNails – Bhumika</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital@1&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:    #F5EAD0;
    --cream2:   #EDD9A3;
    --warm:     #C9A96E;
    --brown:    #7B5B3A;
    --darkbrown:#4A3220;
    --bg:       #2A2033;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 30%, #3d2b52 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, #1f2a40 0%, transparent 55%);
    font-family: 'Jost', sans-serif;
    padding: 24px;
  }

  .card {
    width: 360px;
    background: linear-gradient(160deg, #FAF3E2 0%, #F0DFB8 60%, #E8D09A 100%);
    border-radius: 28px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.45),
      0 0 0 1px rgba(201,169,110,0.3),
      inset 0 1px 0 rgba(255,255,255,0.6);
    overflow: hidden;
    position: relative;
    animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Decorative corner florals */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    opacity: 0.12;
    background: radial-gradient(circle, var(--warm) 0%, transparent 70%);
    pointer-events: none;
  }
  .card::before { top: -40px; left: -40px; }
  .card::after  { bottom: -40px; right: -40px; }

  /* Top decorative line */
  .card-top-line {
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--warm), var(--cream2), var(--warm), transparent);
  }

  .card-body {
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Logo circle */
  .logo-wrap {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2.5px solid var(--warm);
    box-shadow:
      0 0 0 6px rgba(201,169,110,0.15),
      0 8px 30px rgba(123,91,58,0.25);
    overflow: hidden;
    margin-bottom: 20px;
    animation: rise 1.1s 0.15s cubic-bezier(0.22,1,0.36,1) both;
    flex-shrink: 0;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Business name */
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--darkbrown);
    line-height: 1.1;
    text-align: center;
    animation: rise 1.1s 0.2s cubic-bezier(0.22,1,0.36,1) both;
  }

  .brand-name span {
    font-style: italic;
    color: var(--brown);
  }

  .tagline {
    font-family: 'Jost', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--warm);
    margin-top: 6px;
    margin-bottom: 22px;
    animation: rise 1.1s 0.25s cubic-bezier(0.22,1,0.36,1) both;
  }

  /* Divider */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    animation: rise 1.1s 0.3s cubic-bezier(0.22,1,0.36,1) both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--warm));
  }
  .divider::after {
    background: linear-gradient(90deg, var(--warm), transparent);
  }
  .divider-icon {
    font-size: 0.9rem;
    color: var(--warm);
  }

  /* Owner */
  .owner {
    text-align: center;
    margin-bottom: 22px;
    animation: rise 1.1s 0.35s cubic-bezier(0.22,1,0.36,1) both;
  }
  .owner-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brown);
    opacity: 0.65;
    margin-bottom: 2px;
  }
  .owner-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-style: italic;
    color: var(--darkbrown);
    letter-spacing: 0.03em;
  }

  /* Services */
  .services {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin-bottom: 24px;
    animation: rise 1.1s 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }
  .service-pill {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brown);
    border: 1px solid rgba(201,169,110,0.5);
    background: rgba(255,255,255,0.35);
    border-radius: 50px;
    padding: 4px 12px;
  }

  /* Instagram CTA */
  .insta-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    background: linear-gradient(135deg, var(--brown) 0%, var(--darkbrown) 100%);
    color: var(--cream);
    border-radius: 50px;
    padding: 12px 28px;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    box-shadow: 0 6px 20px rgba(74,50,32,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: rise 1.1s 0.45s cubic-bezier(0.22,1,0.36,1) both;
    margin-bottom: 18px;
  }
  .insta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(74,50,32,0.45);
  }
  .insta-btn svg {
    width: 16px;
    height: 16px;
    fill: var(--cream);
    flex-shrink: 0;
  }

  .whatsapp-btn {
    background: linear-gradient(135deg, #25833a 0%, #128c3b 100%);
    box-shadow: 0 6px 20px rgba(18,140,59,0.35);
  }
  .whatsapp-btn:hover {
    box-shadow: 0 10px 28px rgba(18,140,59,0.45);
  }

  /* Bottom note */
  .bottom-note {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-align: center;
    color: var(--brown);
    opacity: 0.55;
    animation: rise 1.1s 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }

  /* Bottom line */
  .card-bottom-line {
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--warm), var(--cream2), var(--warm), transparent);
  }
</style>
</head>
