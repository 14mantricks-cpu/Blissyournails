<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlissYourNails – Premium Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Brand Colors derived from the image_1cea5c.png logo */
    --logo-bg: #FBE4BC;
    --logo-cream: #F3D5A0;
    --logo-warm: #D9AD6C;
    --logo-brown: #714F37;
    --logo-darkbrown: #4A2F1C;
    --logo-ink: #1A120A;
    
    /* Premium UI gradients & backgrounds */
    --ambient-glow-1: rgba(217, 173, 108, 0.35);
    --ambient-glow-2: rgba(113, 79, 55, 0.28);
    --ambient-glow-3: rgba(217, 173, 108, 0.18);
    
    --card-glass-bg: rgba(243, 228, 200, 0.28);
    --card-glass-border: rgba(255, 255, 255, 0.45);
    --card-shadow: rgba(26, 18, 10, 0.55);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    background-color: #0B0806;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse 650px 500px at 50% 78%, var(--ambient-glow-1) 0%, transparent 65%),
      radial-gradient(ellipse 500px 420px at 20% 15%, var(--ambient-glow-2) 0%, transparent 60%),
      radial-gradient(ellipse 600px 480px at 85% 25%, var(--ambient-glow-3) 0%, transparent 60%),
      linear-gradient(180deg, #0B0806 0%, #15100C 100%);
    font-family: 'Jost', sans-serif;
    padding: 40px 20px;
    overflow-x: hidden;
    overflow-y: auto;
    perspective: 1600px;
  }

  /* ============ STAGE & CARD WRAPPER ============ */
  .stage {
    position: relative;
    width: 400px;
    max-width: 100%;
    height: 720px;
    margin: auto;
    perspective: 1600px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============ NATURAL DRIPPING DROPS ============ */
  .drop {
    position: absolute;
    width: 13px;
    height: 17px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    box-shadow: 
      0 4px 10px rgba(0,0,0,.35), 
      inset -2px -2px 4px rgba(0,0,0,.2), 
      inset 2px 2px 3px rgba(255,255,255,.65);
    animation: fall linear infinite;
    animation-fill-mode: backwards;
    z-index: 3;
    pointer-events: none;
  }
  .drop::after {
    content: '';
    position: absolute;
    top: 15%;
    left: 20%;
    width: 35%;
    height: 35%;
    background: rgba(255,255,255,.75);
    border-radius: 50%;
    filter: blur(1px);
  }
  .d1 { left: 44%; top: -10px; background: radial-gradient(circle at 30% 30%, var(--logo-cream), var(--logo-warm) 70%); animation-duration: 4.2s; animation-delay: 0s; }
  .d2 { left: 49%; top: -10px; width: 10px; height: 13px; background: radial-gradient(circle at 30% 30%, var(--logo-bg), var(--logo-brown) 70%); animation-duration: 5.1s; animation-delay: .9s; }
  .d3 { left: 54%; top: -10px; width: 9px; height: 12px; background: radial-gradient(circle at 30% 30%, var(--logo-cream), var(--logo-warm) 70%); animation-duration: 4.7s; animation-delay: 1.8s; }

  @keyframes fall {
    0% { transform: translateY(0) rotate(45deg); opacity: 0; }
    8% { opacity: .95; }
    82% { opacity: .8; }
    100% { transform: translateY(660px) rotate(45deg); opacity: 0; }
  }

  /* ============ FLOWING 3D GEL NAILS ============ */
  .nail {
    position: absolute;
    width: 32px;
    height: 94px;
    border-radius: 50% 50% 45% 45% / 25% 25% 75% 75%;
    box-shadow:
      inset -3px -5px 9px rgba(26, 18, 10, 0.45), 
      inset 3px 4px 7px rgba(255, 255, 255, 0.5), 
      0 12px 24px rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  /* Gloss overlay to replicate thick liquid gel top-coat */
  .nail::after {
    content: '';
    position: absolute;
    top: 5%;
    left: 12%;
    width: 25%;
    height: 85%;
    background: linear-gradient(to right, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 100%);
    border-radius: 50% 50% 45% 45% / 25% 25% 75% 75%;
    filter: blur(1px);
    pointer-events: none;
    z-index: 5;
  }

  /* Internal design canvas inside nail - Scaled up for extra prominence */
  .nail .flower-canvas {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.95;
    z-index: 1;
    transform: scale(1.55);
    transform-origin: center;
  }

  .nail .flower-canvas svg {
    width: 100%;
    height: 100%;
  }

  /* Individual natural nails floating gracefully inside the card space */
  .n1 {
    top: 4%; left: 5%; z-index: 1;
    background: linear-gradient(165deg, var(--logo-bg) 0%, var(--logo-warm) 55%, var(--logo-brown) 100%);
    animation: floatNail1 18s ease-in-out infinite;
    opacity: 0.88;
    pointer-events: none;
  }

  .n2 {
    top: 10%; right: 7%; width: 28px; height: 82px; z-index: 1;
    background: linear-gradient(180deg, var(--logo-darkbrown) 0%, var(--logo-ink) 100%);
    border: 1px solid rgba(217, 173, 108, 0.35);
    animation: floatNail2 20s ease-in-out infinite;
    opacity: 0.88;
    pointer-events: none;
  }

  .n3 {
    top: 36%; left: 4%; width: 26px; height: 78px; z-index: 1;
    background: linear-gradient(145deg, var(--logo-cream) 0%, var(--logo-warm) 60%, var(--logo-darkbrown) 100%);
    animation: floatNail3 22s ease-in-out infinite;
    opacity: 0.88;
    pointer-events: none;
  }

  .n4 {
    bottom: 32%; right: 5%; width: 30px; height: 88px; z-index: 1;
    background: linear-gradient(200deg, var(--logo-brown) 0%, var(--logo-darkbrown) 65%, var(--logo-ink) 100%);
    animation: floatNail4 19s ease-in-out infinite;
    opacity: 0.88;
    pointer-events: none;
  }

  .n5 {
    bottom: 9%; right: 13%; width: 22px; height: 66px; z-index: 1;
    background: linear-gradient(160deg, #FFFDF9 0%, var(--logo-cream) 55%, var(--logo-warm) 100%);
    border: 1px solid rgba(113, 79, 55, 0.25);
    animation: floatNail5 17s ease-in-out infinite;
    opacity: 0.88;
    pointer-events: none;
  }

  .n6 {
    bottom: 7%; left: 9%; width: 28px; height: 84px; z-index: 1;
    background: linear-gradient(160deg, var(--logo-bg) 0%, var(--logo-brown) 50%, var(--logo-ink) 100%);
    animation: floatNail6 24s ease-in-out infinite;
    opacity: 0.88;
    pointer-events: none;
  }

  /* Much more organic, continuous drifting paths to keep nails floating dynamically */
  @keyframes floatNail1 {
    0% { transform: translate3d(0, 0, 0) rotate(-14deg); }
    25% { transform: translate3d(14px, 12px, 0) rotate(-9deg); }
    50% { transform: translate3d(-6px, 24px, 0) rotate(-19deg); }
    75% { transform: translate3d(8px, -8px, 0) rotate(-11deg); }
    100% { transform: translate3d(0, 0, 0) rotate(-14deg); }
  }
  @keyframes floatNail2 {
    0% { transform: translate3d(0, 0, 0) rotate(16deg); }
    25% { transform: translate3d(-18px, 8px, 0) rotate(22deg); }
    50% { transform: translate3d(-8px, 26px, 0) rotate(11deg); }
    75% { transform: translate3d(-22px, -6px, 0) rotate(20deg); }
    100% { transform: translate3d(0, 0, 0) rotate(16deg); }
  }
  @keyframes floatNail3 {
    0% { transform: translate3d(0, 0, 0) rotate(-10deg); }
    25% { transform: translate3d(22px, -12px, 0) rotate(-3deg); }
    50% { transform: translate3d(8px, 16px, 0) rotate(-16deg); }
    75% { transform: translate3d(18px, 6px, 0) rotate(-6deg); }
    100% { transform: translate3d(0, 0, 0) rotate(-10deg); }
  }
  @keyframes floatNail4 {
    0% { transform: translate3d(0, 0, 0) rotate(20deg); }
    25% { transform: translate3d(-24px, -16px, 0) rotate(12deg); }
    50% { transform: translate3d(-10px, -32px, 0) rotate(26deg); }
    75% { transform: translate3d(-18px, 8px, 0) rotate(15deg); }
    100% { transform: translate3d(0, 0, 0) rotate(20deg); }
  }
  @keyframes floatNail5 {
    0% { transform: translate3d(0, 0, 0) rotate(-6deg); }
    25% { transform: translate3d(-16px, -24px, 0) rotate(-18deg); }
    50% { transform: translate3d(8px, -12px, 0) rotate(-2deg); }
    75% { transform: translate3d(-10px, 10px, 0) rotate(-11deg); }
    100% { transform: translate3d(0, 0, 0) rotate(-6deg); }
  }
  @keyframes floatNail6 {
    0% { transform: translate3d(0, 0, 0) rotate(13deg); }
    25% { transform: translate3d(20px, -22px, 0) rotate(22deg); }
    50% { transform: translate3d(28px, 8px, 0) rotate(6deg); }
    75% { transform: translate3d(12px, -10px, 0) rotate(17deg); }
    100% { transform: translate3d(0, 0, 0) rotate(13deg); }
  }

  /* ============ PREMIUM LIQUID GLASS CARD ============ */
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -46%);
    width: 360px;
    border-radius: 34px;
    z-index: 2;
    background-color: var(--card-glass-bg);
    background-image: linear-gradient(165deg, rgba(251, 228, 188, 0.45) 0%, rgba(243, 213, 160, 0.22) 40%, rgba(113, 79, 55, 0.12) 100%);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1.5px solid var(--card-glass-border);
    box-shadow: 
      0 35px 95px var(--card-shadow), 
      0 0 0 1px rgba(255, 255, 255, 0.05),
      inset 0 1px 2px rgba(255, 255, 255, 0.9), 
      inset 0 -18px 40px rgba(74, 50, 32, 0.12), 
      inset 0 18px 30px rgba(255, 255, 255, 0.18);
    overflow: hidden;
    animation: rise 1s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, -42%) scale(.94); }
    to { opacity: 1; transform: translate(-50%, -46%) scale(1); }
  }

  .sheen {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.45) 46%, rgba(255, 255, 255, 0.03) 54%, transparent 70%);
    background-size: 220% 220%;
    animation: sheenMove 7s ease-in-out infinite;
    mix-blend-mode: overlay;
  }
  @keyframes sheenMove {
    0%, 100% { background-position: 120% -20%; }
    50% { background-position: -20% 120%; }
  }

  .card-top-line, .card-bottom-line {
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--logo-warm), var(--logo-cream), var(--logo-warm), transparent);
    opacity: .75;
  }

  .card-body {
    padding: 34px 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  /* ============ LOGO & TYPOGRAPHY ============ */
  .logo-wrap {
    width: 126px;
    height: 126px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: 
      0 0 0 6px rgba(217, 173, 108, 0.25), 
      0 10px 30px rgba(0, 0, 0, 0.45), 
      inset 0 2px 6px rgba(255, 255, 255, 0.6);
    overflow: hidden;
    margin-bottom: 18px;
    flex-shrink: 0;
    background-color: var(--logo-bg);
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .tagline {
    font-size: .68rem;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--logo-darkbrown);
    margin-top: 2px;
    margin-bottom: 18px;
    font-weight: 500;
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--logo-warm));
  }
  .divider::after {
    background: linear-gradient(90deg, var(--logo-warm), transparent);
  }
  .divider-icon {
    font-size: .85rem;
    color: var(--logo-warm);
  }

  .owner {
    text-align: center;
    margin-bottom: 18px;
  }
  .owner-label {
    font-size: .62rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--logo-darkbrown);
    opacity: .85;
    margin-bottom: 2px;
  }
  .owner-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-style: italic;
    color: var(--logo-darkbrown);
    font-weight: 500;
  }

  /* ============ SERVICES ============ */
  .services {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 22px;
    width: 100%;
  }
  .service-pill {
    font-size: .62rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--logo-darkbrown);
    border: 1px solid rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.4);
    border-radius: 50px;
    padding: 6px 10px;
    text-align: center;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
  }
  .service-pill:hover {
    background: rgba(217, 173, 108, 0.2);
    border-color: var(--logo-warm);
  }

  /* ============ BUTTONS & CTAS ============ */
  .cta-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-bottom: 16px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-decoration: none;
    border-radius: 50px;
    padding: 12px 20px;
    font-size: .72rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #fff;
    font-weight: 400;
    transition: transform .2s, box-shadow .2s;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  .btn:hover {
    transform: translateY(-2px);
  }
  .btn svg {
    width: 15px;
    height: 15px;
    fill: #fff;
    flex-shrink: 0;
  }
  .insta-btn {
    background: linear-gradient(135deg, var(--logo-brown) 0%, var(--logo-darkbrown) 100%);
    box-shadow: 0 6px 20px rgba(74, 50, 32, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .insta-btn:hover {
    box-shadow: 0 8px 24px rgba(74, 50, 32, 0.6);
  }
  .whatsapp-btn {
    background: linear-gradient(135deg, #2fae55 0%, #128c3b 100%);
    box-shadow: 0 6px 20px rgba(18, 140, 59, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .whatsapp-btn:hover {
    box-shadow: 0 8px 24px rgba(18, 140, 59, 0.5);
  }

  .bottom-note {
    text-align: center;
    color: var(--logo-darkbrown);
  }
  .story-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.92rem;
    font-style: italic;
    color: var(--logo-darkbrown);
    letter-spacing: 0.08em;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .est-mumbai {
    font-size: 0.52rem;
    letter-spacing: 0.12em;
    opacity: 0.7;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="stage">

  <!-- Ambient Paint Drops -->
  <div class="drop d1"></div>
  <div class="drop d2"></div>
  <div class="drop d3"></div>

  <!-- Liquid Glass Card -->
  <div class="card">
    
    <!-- Floating Nails Inside Card for Bounded Natural Movement -->
    
    <!-- Nail 1: Highly Intricate Tulip Flower design on top nail -->
    <div class="nail n1">
      <div class="flower-canvas">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Highly detailed vine and stem -->
          <path d="M50 88 C48 70 45 52 48 38" fill="none" stroke="#4A2F1C" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M48 65 C38 62 34 52 38 42 C40 45 44 55 48 60" fill="#D9AD6C" stroke="#4A2F1C" stroke-width="1" opacity="0.9"/>
          <path d="M49 52 C58 48 62 38 58 28 C56 31 52 41 49 48" fill="#D9AD6C" stroke="#4A2F1C" stroke-width="1" opacity="0.9"/>
          <!-- Intricate Tulip Flower Petals -->
          <path d="M48 38 C40 30 42 16 48 12 C54 16 56 30 48 38 Z" fill="#FBE4BC" stroke="#714F37" stroke-width="1.2"/>
          <path d="M48 38 C34 32 36 18 44 14 C47 24 49 32 48 38 Z" fill="#F3D5A0" stroke="#4A2F1C" stroke-width="1.5"/>
          <path d="M48 38 C62 32 60 18 52 14 C49 24 47 32 48 38 Z" fill="#D9AD6C" stroke="#4A2F1C" stroke-width="1.5"/>
          <path d="M48 38 C44 26 46 18 48 15 C50 18 52 26 48 38 Z" fill="#FFFDF9" stroke="#1A120A" stroke-width="1"/>
          <!-- Decorative gold sparkles -->
          <circle cx="30" cy="25" r="1.5" fill="#D9AD6C"/>
          <circle cx="70" cy="30" r="1.5" fill="#D9AD6C"/>
          <circle cx="50" cy="8" r="1.2" fill="#FBE4BC"/>
        </svg>
      </div>
    </div>

    <!-- Nail 2: Intricate Boho-Luxury Evil Eye design (Matching Brand Colors) -->
    <div class="nail n2">
      <div class="flower-canvas">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer gold protection border -->
          <path d="M25 50 C25 35 75 35 75 50 C75 65 25 65 25 50 Z" fill="none" stroke="#D9AD6C" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Inner Cream highlight outline -->
          <path d="M32 50 C32 40 68 40 68 50 C68 60 32 60 32 50 Z" fill="none" stroke="#FBE4BC" stroke-width="1.5"/>
          <!-- Large luxurious Iris -->
          <circle cx="50" cy="50" r="13" fill="#714F37"/>
          <circle cx="50" cy="50" r="9" fill="#D9AD6C"/>
          <!-- Pupil -->
          <circle cx="50" cy="50" r="5" fill="#1A120A"/>
          <!-- Precise glare highlight -->
          <circle cx="47" cy="47" r="1.8" fill="#FFFDF9"/>
          
          <!-- Detailed eyelashes (sunburst) -->
          <line x1="50" y1="34" x2="50" y2="26" stroke="#D9AD6C" stroke-width="2" stroke-linecap="round"/>
          <line x1="38" y1="38" x2="33" y2="31" stroke="#D9AD6C" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="62" y1="38" x2="67" y2="31" stroke="#D9AD6C" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="28" y1="50" x2="20" y2="50" stroke="#D9AD6C" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="72" y1="50" x2="80" y2="50" stroke="#D9AD6C" stroke-width="1.5" stroke-linecap="round"/>
          
          <line x1="50" y1="66" x2="50" y2="72" stroke="#4A2F1C" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="40" y1="62" x2="36" y2="67" stroke="#4A2F1C" stroke-width="1" stroke-linecap="round"/>
          <line x1="60" y1="62" x2="64" y2="67" stroke="#4A2F1C" stroke-width="1" stroke-linecap="round"/>

          <!-- Intricate micro-dot details -->
          <circle cx="50" cy="20" r="1.5" fill="#FBE4BC"/>
          <circle cx="50" cy="80" r="1.5" fill="#FBE4BC"/>
          <circle cx="25" cy="28" r="1.2" fill="#D9AD6C"/>
          <circle cx="75" cy="28" r="1.2" fill="#D9AD6C"/>
        </svg>
      </div>
    </div>

    <!-- Nail 3: Intricate Celestial Moon, Sunburst & Constellation design -->
    <div class="nail n3">
      <div class="flower-canvas">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Highly detailed Crescent Moon -->
          <path d="M50 25 C65 25 70 40 65 55 C60 70 45 75 35 68 C48 68 56 58 53 45 C51 35 45 28 50 25 Z" fill="#4A2F1C" stroke="#D9AD6C" stroke-width="1.2"/>
          
          <!-- Intricate moon carvings & dots -->
          <path d="M51 35 C54 38 54 44 51 47" fill="none" stroke="#FBE4BC" stroke-width="1" stroke-linecap="round"/>
          <circle cx="58" cy="42" r="1" fill="#D9AD6C"/>
          <circle cx="56" cy="52" r="1" fill="#D9AD6C"/>

          <!-- Central Polaris Starburst -->
          <g transform="translate(32, 34)">
            <line x1="0" y1="-14" x2="0" y2="14" stroke="#D9AD6C" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="-14" y1="0" x2="14" y2="0" stroke="#D9AD6C" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="-8" y1="-8" x2="8" y2="8" stroke="#D9AD6C" stroke-width="0.8"/>
            <line x1="8" y1="-8" x2="-8" y2="8" stroke="#D9AD6C" stroke-width="0.8"/>
            <circle cx="0" cy="0" r="2.5" fill="#F3D5A0"/>
            <circle cx="0" cy="0" r="1" fill="#1A120A"/>
          </g>

          <!-- Constellation lines & stars -->
          <polyline points="22,70 34,80 52,78" fill="none" stroke="#D9AD6C" stroke-width="0.6" stroke-dasharray="2,2"/>
          <circle cx="22" cy="70" r="1.5" fill="#F3D5A0"/>
          <circle cx="34" cy="80" r="1.5" fill="#F3D5A0"/>
          <circle cx="52" cy="78" r="2" fill="#D9AD6C"/>
          <circle cx="70" cy="74" r="1.2" fill="#FBE4BC"/>
        </svg>
      </div>
    </div>

    <!-- Nail 4: Intricate Chandelier Sacred Lotus design -->
    <div class="nail n4">
      <div class="flower-canvas">
